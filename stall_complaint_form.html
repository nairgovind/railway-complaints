<!DOCTYPE html>
<html lang="en">
<head>

            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
            margin-top: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .stall-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .stall-info h2 {
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 2px solid rgba(255,255,255,0.3);
            padding-bottom: 10px;
        }

        .info-row {
            display: flex;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .info-label {
            font-weight: 600;
            min-width: 120px;
            opacity: 0.9;
        }

        .info-value {
            flex: 1;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            min-height: 120px;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .char-count {
            text-align: right;
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .error-box {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .error-box.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

                </div>
                <div class="info-row">

                </div>
                <div class="info-row">

                </div>
                <div class="info-row">

                </div>
                <div class="info-row">
                    <span class="info-label">Location:</span>

                </div>
            </div>

            <form id="complaintForm">
                <div class="form-group">
                    <label for="complaint">Your Complaint *</label>
                    <textarea 
                        id="complaint" 
                        placeholder="Please describe your complaint in detail..."
                        required
                        maxlength="1000"
                    ></textarea>
                    <div class="char-count">
                        <span id="charCount">0</span>/1000 characters
                    </div>
                </div>

                <button type="submit" class="btn" id="submitBtn">
                    <span>📱 Send to WhatsApp</span>
                </button>
            </form>
        </div>
    </div>

        // Get stall ID from URL parameter

        }

        // Find stall by ID
        function findStall(stallId) {
            return stallsDatabase.find(stall => stall.stall_id === stallId);
        }

        // Show error message
        function showError(message) {
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('errorBox').classList.add('show');
            document.getElementById('loading').classList.remove('show');
        }

        // Load stall information
        function loadStallInfo() {
            const stallId = getStallIdFromURL();

            if (!stallId) {
                showError('No stall ID provided. Please scan a valid QR code.');
                return;
            }

            currentStall = findStall(stallId);

            if (!currentStall) {
                showError(`Stall with ID "${stallId}" not found. Please contact support.`);
                return;
            }

            // Populate stall information
            document.getElementById('stallId').textContent = currentStall.stall_id;
            document.getElementById('stationName').textContent = currentStall.station_name;
            document.getElementById('stationCode').textContent = currentStall.station_code;
            document.getElementById('contractor').textContent = currentStall.contractor;
            document.getElementById('location').textContent = currentStall.location;

            // Show content area
            document.getElementById('loading').classList.remove('show');
            document.getElementById('contentArea').style.display = 'block';
        }

        // Character counter
        const complaintTextarea = document.getElementById('complaint');
        const charCount = document.getElementById('charCount');

        complaintTextarea.addEventListener('input', function() {
            charCount.textContent = this.value.length;
        });

        // Handle form submission
        document.getElementById('complaintForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const complaint = complaintTextarea.value.trim();

            if (!complaint) {
                alert('Please enter your complaint before submitting.');
                return;
            }

            if (!currentStall) {
                alert('Stall information not loaded. Please try again.');
                return;
            }

            // Construct WhatsApp message
            const message = `🚂 RAILWAY STALL COMPLAINT\n` +
                          `━━━━━━━━━━━━━━━━━━━━━━\n\n` +

                          `• Contractor: ${currentStall.contractor}\n` +
                          `• Location: ${currentStall.location}\n\n` +
                          `💬 COMPLAINT:\n${complaint}\n\n` +
                          `📅 Date: ${new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' })}`;

            // Encode message for URL
            const encodedMessage = encodeURIComponent(message);

            // Create WhatsApp link
            const whatsappURL = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMessage}`;

            // Open WhatsApp
            window.open(whatsappURL, '_blank');
        });

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', function() {
            document.getElementById('loading').classList.add('show');
            setTimeout(loadStallInfo, 500); // Small delay for better UX
        });
